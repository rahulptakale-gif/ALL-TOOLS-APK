
name: Build ALL TOOLS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP file not found"
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Build Debug APK
        run: |
          ANDROID_DIR=$(dirname "$(find project -type f -name settings.gradle | head -n 1)")
          if [ -z "$ANDROID_DIR" ]; then
            echo "Android project folder not found"
            exit 1
          fi
          gradle -p "$ANDROID_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALL-TOOLS-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
          
