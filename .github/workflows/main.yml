
name: Build ALL TOOLS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project ZIP
        run: unzip -q all-tools---ultimate-utility-app.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle -p project/all-tools---ultimate-utility-app/android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALL-TOOLS-APK
          path: project/all-tools---ultimate-utility-app/android/app/build/outputs/apk/debug/app-debug.apk
        
      
          
